<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sleek Slate-900 App Icon Badge (Matching LivraLink official emblem) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="14" />

  <!-- Speed / Connection Link Streamlines -->
  <path d="M 68 210 L 130 210" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  <path d="M 44 256 L 115 256" stroke="#60a5fa" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  <path d="M 72 302 L 136 302" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.6" />

  <!-- Truck Body & Cabin -->
  <g filter="url(#glow)">
    <!-- Cargo Box -->
    <rect x="140" y="148" width="186" height="152" rx="20" fill="url(#truckGrad)" />
    
    <!-- Link Motif on Cargo Container -->
    <circle cx="204" cy="224" r="14" fill="#ffffff" />
    <circle cx="262" cy="224" r="14" fill="#ffffff" />
    <path d="M 204 224 L 262 224" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Truck Cabin -->
    <path d="M 326 196 L 388 196 C 396 196 404 200 409 207 L 442 254 C 445 258 447 263 447 268 L 447 290 C 447 296 442 300 436 300 L 326 300 Z" fill="url(#truckGrad)" />

    <!-- Windshield Glass -->
    <path d="M 342 212 L 382 212 C 386 212 390 214 393 218 L 420 254 C 422 256 422 258 420 260 L 342 260 Z" fill="#0f172a" opacity="0.85" />
    <path d="M 342 212 L 382 212 C 386 212 390 214 393 218 L 420 254 C 422 256 422 258 420 260 L 342 260 Z" fill="#e0f2fe" opacity="0.3" />
  </g>

  <!-- Wheels Chassis Cutouts & Wheels -->
  <!-- Rear Wheel -->
  <circle cx="210" cy="308" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="10" />
  <circle cx="210" cy="308" r="22" fill="#1e293b" />
  <circle cx="210" cy="308" r="10" fill="#ffffff" />

  <!-- Front Wheel -->
  <circle cx="390" cy="308" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="10" />
  <circle cx="390" cy="308" r="22" fill="#1e293b" />
  <circle cx="390" cy="308" r="10" fill="#ffffff" />
</svg>
