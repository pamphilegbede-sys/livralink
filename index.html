<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LivraLink - Plateforme logistique urbaine connectée</title>
    <meta name="description" content="Plateforme logistique urbaine connectée pour le commerce social et les coursiers urbains." />
    <meta property="og:title" content="LivraLink - Plateforme logistique urbaine connectée" />
    <meta property="og:description" content="Connectez vos ventes WhatsApp, Instagram, TikTok et boutiques directement aux coursiers urbains certifiés." />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Environment Compatibility Script -->
    <script>
      (function() {
        try {
          // Intercept Vite HMR WebSocket in AI Studio iframe environment where HMR is disabled
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OriginalWebSocket = window.WebSocket;
            var MockWebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite')))) {
                var target = new EventTarget();
                target.readyState = 1; // OPEN
                target.bufferedAmount = 0;
                target.extensions = '';
                target.protocol = 'vite-hmr';
                target.binaryType = 'blob';
                target.url = url;
                target.send = function() {};
                target.close = function() {};
                return target;
              }
              return new OriginalWebSocket(url, protocols);
            };
            MockWebSocket.prototype = OriginalWebSocket.prototype;
            MockWebSocket.CONNECTING = 0;
            MockWebSocket.OPEN = 1;
            MockWebSocket.CLOSING = 2;
            MockWebSocket.CLOSED = 3;
            window.WebSocket = MockWebSocket;
          }
        } catch (wsErr) {}

        try {
          var originalConsoleError = console.error;
          console.error = function() {
            var firstArg = arguments[0];
            var str = firstArg ? (firstArg.message || String(firstArg)) : '';
            if (str.includes('WebSocket closed without opened') || str.includes('WebSocket') || str.includes('vite-hmr')) {
              return;
            }
            return originalConsoleError.apply(console, arguments);
          };
        } catch (cErr) {}

        try {
          var originalFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property is locked
        }

        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || (event.error && event.error.message) || '') : '';
          if (
            msg.includes('fetch of #<Window>') ||
            msg.includes('WebSocket closed without opened') ||
            msg.includes('WebSocket') ||
            msg.includes('vite-hmr')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event ? (event.reason ? (event.reason.message || String(event.reason)) : '') : '';
          if (
            reason.includes('WebSocket closed without opened') ||
            reason.includes('WebSocket') ||
            reason.includes('vite-hmr')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <body class="h-full bg-[#faf8ff] text-[#131b2e] antialiased selection:bg-[#1d4ed8] selection:text-white">
    <div id="root" class="h-full min-h-screen">
      <!-- Instant Zero-Latency Brand Loader (Pre-Hydration) -->
      <div id="initial-loader" style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#ffffff;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;">
        <div style="width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -6px rgba(37,99,235,0.5);margin-bottom:20px;animation:pulseBrand 1.6s ease-in-out infinite;">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13"></rect>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
            <circle cx="5.5" cy="18.5" r="2.5"></circle>
            <circle cx="18.5" cy="18.5" r="2.5"></circle>
          </svg>
        </div>
        <div style="font-size:24px;font-weight:900;letter-spacing:-0.5px;margin-bottom:6px;">
          Livra<span style="color:#3b82f6;">Link</span>
        </div>
        <div style="font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:26px;">
          Logistique Urbaine Connectée
        </div>
        <div style="width:140px;height:4px;background:#1e293b;border-radius:9999px;overflow:hidden;position:relative;">
          <div style="width:45%;height:100%;background:#3b82f6;border-radius:9999px;animation:loadbar 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes pulseBrand { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.92; } }
          @keyframes loadbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
