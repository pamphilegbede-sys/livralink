    <!-- Environment Compatibility Script -->
    <script>
      (function() {
        try {
          var originalFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property is locked
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('fetch of #<Window>')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
