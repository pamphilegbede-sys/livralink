runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 5
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
  - variable: SMTP_HOST
    value: smtp.gmail.com
  - variable: SMTP_PORT
    value: "587"
  - variable: SMTP_FROM
    value: LivraLink <Pamphile.gbede@gmail.com>
  - variable: OTP_SECRET_SALT
    secret: OTP_SECRET_SALT
    availability:
      - RUNTIME
# Secrets RUNTIME optionnels recommandés dans Google Cloud Secret Manager (délivrer via
# `firebase apphosting:secrets:set <NOM>` et accorder l'accès au backend App Hosting avant d'activer) :
# - EMAIL_ENCRYPTION_SECRET (>= 32 caractères ; sinon OTP_SECRET_SALT dérive la clé AES-256-GCM SMTP via HKDF)
# - GMAIL_SMTP_USER / GMAIL_SMTP_PASS (repli serveur si la configuration SMTP partagée Firestore n'est pas définie)

