# Firebase App Hosting Configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
  - variable: SMTP_HOST
    value: smtp.gmail.com
  - variable: SMTP_PORT
    value: "587"
  - variable: GMAIL_SMTP_USER
    secret: GMAIL_SMTP_USER
    availability:
      - RUNTIME
  - variable: GMAIL_SMTP_PASS
    secret: GMAIL_SMTP_PASS
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: "LivraLink <Pamphile.gbede@gmail.com>"

